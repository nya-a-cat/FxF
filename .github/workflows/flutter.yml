name: Flutter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/bootstrap.sh
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
